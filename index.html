<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/aoi_padanggalak_3.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-8.669718607064507,115.24874836820639],[-8.64436833109848,115.29598936131721]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_CitraLatarEsriSatelite_0');
        map.getPane('pane_CitraLatarEsriSatelite_0').style.zIndex = 400;
        var layer_CitraLatarEsriSatelite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_CitraLatarEsriSatelite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_CitraLatarEsriSatelite_0;
        map.addLayer(layer_CitraLatarEsriSatelite_0);
        map.createPane('pane_LandCover_Padanggalak_v2_1');
        map.getPane('pane_LandCover_Padanggalak_v2_1').style.zIndex = 401;
        var img_LandCover_Padanggalak_v2_1 = 'data/LandCover_Padanggalak_v2_1.png';
        var img_bounds_LandCover_Padanggalak_v2_1 = [[-9.134276021596659,115.18003025401549],[-8.137976445064544,116.18122488112444]];
        var layer_LandCover_Padanggalak_v2_1 = new L.imageOverlay(img_LandCover_Padanggalak_v2_1,
                                              img_bounds_LandCover_Padanggalak_v2_1,
                                              {pane: 'pane_LandCover_Padanggalak_v2_1'});
        bounds_group.addLayer(layer_LandCover_Padanggalak_v2_1);
        map.addLayer(layer_LandCover_Padanggalak_v2_1);
        map.createPane('pane_TutupanLahanClipped_2');
        map.getPane('pane_TutupanLahanClipped_2').style.zIndex = 402;
        var img_TutupanLahanClipped_2 = 'data/TutupanLahanClipped_2.png';
        var img_bounds_TutupanLahanClipped_2 = [[-8.663172468809845,115.26138373367151],[-8.651499688249324,115.28360508363849]];
        var layer_TutupanLahanClipped_2 = new L.imageOverlay(img_TutupanLahanClipped_2,
                                              img_bounds_TutupanLahanClipped_2,
                                              {pane: 'pane_TutupanLahanClipped_2'});
        bounds_group.addLayer(layer_TutupanLahanClipped_2);
        map.addLayer(layer_TutupanLahanClipped_2);
        function pop_aoi_padanggalak_3(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_aoi_padanggalak_3_0() {
            return {
                pane: 'pane_aoi_padanggalak_3',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0, 
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_aoi_padanggalak_3');
        map.getPane('pane_aoi_padanggalak_3').style.zIndex = 403;
        map.getPane('pane_aoi_padanggalak_3').style['mix-blend-mode'] = 'normal';
        var layer_aoi_padanggalak_3 = new L.geoJson(json_aoi_padanggalak_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_aoi_padanggalak_3',
            layerName: 'layer_aoi_padanggalak_3',
            pane: 'pane_aoi_padanggalak_3',
            onEachFeature: pop_aoi_padanggalak_3,
            style: style_aoi_padanggalak_3_0,
        });
        bounds_group.addLayer(layer_aoi_padanggalak_3);
        map.addLayer(layer_aoi_padanggalak_3);
        map.createPane('pane_TSSmgL_4');
        map.getPane('pane_TSSmgL_4').style.zIndex = 404;
        var img_TSSmgL_4 = 'data/TSSmgL_4.png';
        var img_bounds_TSSmgL_4 = [[-8.663263696647384,115.26129246268256],[-8.651408864767335,115.28378720091726]];
        var layer_TSSmgL_4 = new L.imageOverlay(img_TSSmgL_4,
                                              img_bounds_TSSmgL_4,
                                              {pane: 'pane_TSSmgL_4'});
        bounds_group.addLayer(layer_TSSmgL_4);
        map.addLayer(layer_TSSmgL_4);
        map.createPane('pane_NDTI_5');
        map.getPane('pane_NDTI_5').style.zIndex = 405;
        var img_NDTI_5 = 'data/NDTI_5.png';
        var img_bounds_NDTI_5 = [[-8.663263696647384,115.26129246268256],[-8.651408864767335,115.28378720091726]];
        var layer_NDTI_5 = new L.imageOverlay(img_NDTI_5,
                                              img_bounds_NDTI_5,
                                              {pane: 'pane_NDTI_5'});
        bounds_group.addLayer(layer_NDTI_5);
        map.addLayer(layer_NDTI_5);
        var overlaysTree = [
            {label: "NDTI", layer: layer_NDTI_5},
            {label: "TSS (mg/L)", layer: layer_TSSmgL_4},
            {label: '<img src="legend/aoi_padanggalak_3.png" /> aoi_padanggalak', layer: layer_aoi_padanggalak_3},
            {label: "Tutupan Lahan Clipped", layer: layer_TutupanLahanClipped_2},
            {label: "LandCover_Padanggalak_v2", layer: layer_LandCover_Padanggalak_v2_1},
            {label: "Citra Latar: Esri Satelite", layer: layer_CitraLatarEsriSatelite_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        </script>        
    </body>
</html>
